<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BK Training Management & Intelligence Dashboard 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo-block">
        <div class="logo-icon">BK</div>
        <div class="logo-text">
          <div class="logo-title">BK Training</div>
          <div class="logo-sub">Dashboard 2026</div>
        </div>
      </div>
    </div>
    <nav id="main-nav">
      <a href="#" class="nav-item active" data-section="dashboard"><span class="nav-icon">⊞</span>Dashboard Utama</a>
      <a href="#" class="nav-item" data-section="perancangan"><span class="nav-icon">📅</span>Perancangan Latihan</a>
      <a href="#" class="nav-item" data-section="kertaskerja"><span class="nav-icon">📄</span>Kertas Kerja</a>
      <a href="#" class="nav-item" data-section="kelulusan"><span class="nav-icon">✅</span>Kelulusan</a>
      <a href="#" class="nav-item" data-section="pelaksanaan"><span class="nav-icon">▶</span>Pelaksanaan</a>
      <a href="#" class="nav-item" data-section="peserta"><span class="nav-icon">👥</span>Peserta &amp; Kehadiran</a>
      <a href="#" class="nav-item" data-section="kewangan"><span class="nav-icon">💰</span>Peruntukan &amp; Kewangan</a>
      <a href="#" class="nav-item" data-section="laporan"><span class="nav-icon">📊</span>Laporan</a>
      <a href="#" class="nav-item" data-section="penilaian"><span class="nav-icon">⭐</span>Penilaian &amp; CQI</a>
      <a href="#" class="nav-item" data-section="dokumen"><span class="nav-icon">🗂</span>Dokumen</a>
      <a href="#" class="nav-item" data-section="tindakan"><span class="nav-icon">🔔</span>Tindakan Susulan</a>
      <a href="#" class="nav-item" data-section="import"><span class="nav-icon">⬆</span>Import Data</a>
      <a href="#" class="nav-item" data-section="tetapan"><span class="nav-icon">⚙</span>Tetapan</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">TC</div>
        <div>
          <div class="user-name" id="currentUser">Penyelaras Latihan</div>
          <div class="user-role" id="currentRole">Koordinator</div>
        </div>
      </div>
    </div>
  </aside>
  <main id="main-content">
    <header id="top-bar">
      <button id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
      <div id="page-title">Dashboard Utama</div>
      <div class="top-bar-right">
        <span id="clock"></span>
        <div id="alert-bell" onclick="showSection('tindakan')">
          🔔 <span class="badge" id="alertCount">0</span>
        </div>
      </div>
    </header>
    <div id="content-area"></div>
  </main>
</div>
<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()"></div>
<div id="modal-box" class="modal-box hidden">
  <div id="modal-header" class="modal-header">
    <span id="modal-title">Modal</span>
    <button onclick="closeModal()">✕</button>
  </div>
  <div id="modal-body" class="modal-body"></div>
  <div id="modal-footer" class="modal-footer"></div>
</div>
<div id="toast-container"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
